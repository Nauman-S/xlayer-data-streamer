version: "3.8"
networks:
  default:
    name: "relay"
    driver: bridge
    ipam:
      config:
        - subnet: "192.168.1.0/24"

services:
  relay-parent:
    container_name: relay1
    image: datastream-relay:test
    volumes:
      - ./config/config.toml:/app/config.toml
      - ./data/:/data
    command:
      - "/bin/sh"
      - "-c"
      - "/app/dsrelay --cfg /app/config.toml"
    cap_add:
      - SYS_ADMIN
    privileged: true
    sysctls:
      net.ipv4.tcp_wmem: "4096 4194304 4194304"
    networks:
      default:
        ipv4_address: 192.168.1.10



  relay-client-1:
    container_name: relay2
    image: datastream-relay:test
    volumes:
      - ./config/config2.toml:/app/config.toml
      - ./data2/:/data
    command:
      - "/bin/sh"
      - "-c"
      - "/app/dsrelay --cfg /app/config.toml"
    networks:
      default:
        ipv4_address: 192.168.1.11

  relay-client-2:
    container_name: relay3
    image: datastream-relay:test
    volumes:
      - ./config/config3.toml:/app/config.toml
      - ./data3/:/data
    command:
      - "/bin/sh"
      - "-c"
      - "/app/dsrelay --cfg /app/config.toml"

    networks:
      default:
        ipv4_address: 192.168.1.12


  prometheus:
    container_name: prom
    image: prom/prometheus:v3.2.1
    command:
      --
#      - --config.file=

  grafana:
    container_name: grafana
    image: grafana/grafana:11.6.0
    ports:
      - "3000:3000"
    environment:
      - GF_LOG_LEVEL=debug
      - GF_AUTH_BASIC_ENABLED=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards

